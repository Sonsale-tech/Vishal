<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electrostatics MCQ Test</title>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#fff9cc;margin:0;padding:15px}.container{max-width:700px;margin:auto}
h1{text-align:center;color:#003366;font-size:26px;line-height:1.4}.screen{background:white;border:2px solid #003366;border-radius:10px;padding:20px;margin-top:20px}
.info-label{display:block;font-weight:bold;margin-top:15px}.info-input{width:100%;padding:12px;margin-top:6px;border:1px solid #999;border-radius:6px;font-size:17px}
.question-number{text-align:center;color:#003366;font-size:18px;font-weight:bold;margin-bottom:15px}.question-text{font-size:19px;line-height:1.6;margin-bottom:20px}
.option{display:block;background:#e6ffff;border:1px solid #999;border-radius:7px;padding:13px;margin:10px 0;cursor:pointer;font-size:17px}.option:hover{background:#d8f5f5}.option input{margin-right:10px}
.button-area{text-align:center;margin-top:25px}button{background:#003366;color:white;border:none;padding:12px 28px;border-radius:6px;cursor:pointer;font-size:17px;margin:5px}button:hover{background:#005599}
.hidden{display:none}.result{text-align:center;font-size:22px;font-weight:bold;color:#003366;line-height:1.6}.success{color:green;font-weight:bold}.error{color:red;font-weight:bold}
@media(max-width:500px){body{padding:8px}h1{font-size:22px}.screen{padding:15px}.question-text{font-size:18px}.option{font-size:16px}}
</style>
</head>
<body>
<div class="container">
<h1>Std. XI Physics<br>Electrostatics MCQ Test</h1>

<div id="studentScreen" class="screen">
<h2>Student Information</h2>
<label class="info-label">Student Name</label>
<input type="text" id="studentName" class="info-input" placeholder="Enter your full name">
<label class="info-label">Roll No.</label>
<input type="text" id="rollNo" class="info-input" placeholder="Enter your Roll No.">
<div class="button-area"><button onclick="startTest()">NEXT</button></div>
</div>

<div id="questionScreen" class="screen hidden">
<div id="questionNumber" class="question-number"></div>
<div id="questionText" class="question-text"></div>
<div id="optionsContainer"></div>
<div class="button-area"><button id="nextButton" onclick="nextQuestion()">NEXT</button></div>
</div>

<div id="resultScreen" class="screen hidden">
<h2 style="text-align:center;">Test Completed</h2>
<div id="result" class="result"></div>
<div id="savingMessage" style="text-align:center;margin-top:20px;"></div>
</div>
</div>

<script>
const questions=[
{q:"The SI unit of electric charge is",options:["Ampere","Volt","Coulomb","Newton"],answer:2},
{q:"The electric charge on an electron is",options:["\\(+1.6 \\times 10^{-19}\\,C\\)","\\(-1.6 \\times 10^{-19}\\,C\\)","\\(1.6 \\times 10^{-19}\\,C\\)","Zero"],answer:1},
{q:"According to the law of conservation of electric charge, the total electric charge of an isolated system",options:["Always increases","Always decreases","Remains constant","Always becomes zero"],answer:2},
{q:"When two electric charges have the same sign, the force between them is",options:["Attractive","Repulsive","Zero","Sometimes zero and sometimes attractive"],answer:1},
{q:"Coulomb's law gives the magnitude of the electrostatic force between two",options:["Current-carrying conductors","Point charges","Magnets","Resistors"],answer:1},
{q:"According to Coulomb's law, the electrostatic force between two point charges is given by \\(F=k\\dfrac{q_1q_2}{r^2}\\). If the distance between the two charges is doubled, while the charges remain unchanged, the force becomes",options:["Twice the original force","Half the original force","One-fourth of the original force","Four times the original force"],answer:2},
{q:"The value of Coulomb's constant \\(k=\\dfrac{1}{4\\pi\\varepsilon_0}\\) in vacuum is approximately",options:["\\(9\\times10^9\\,Nm^2/C^2\\)","\\(9\\times10^{-9}\\,Nm^2/C^2\\)","\\(8.85\\times10^{-12}\\,C^2/Nm^2\\)","\\(3\\times10^8\\,m/s\\)"],answer:0},
{q:"If one of the two point charges is doubled, while the other charge and the distance between them remain unchanged, the electrostatic force becomes",options:["Half of its original value","Twice its original value","Four times its original value","Unchanged"],answer:1},
{q:"Two point charges \\(+2\\,\\mu C\\) and \\(+3\\,\\mu C\\) are placed near each other in vacuum. The electrostatic force between them is",options:["Attractive","Repulsive","Zero","Cannot be determined from the signs of the charges"],answer:1},
{q:"The electrostatic force between two point charges acts along",options:["A direction perpendicular to the line joining the charges","The line joining the two charges","A circular path around the charges","The vertical direction only"],answer:1}
];

let currentQuestion=0,studentName="",rollNo="",score=0;

function startTest(){
studentName=document.getElementById("studentName").value.trim();
rollNo=document.getElementById("rollNo").value.trim();
if(studentName===""){alert("Please enter your Student Name.");document.getElementById("studentName").focus();return;}
if(rollNo===""){alert("Please enter your Roll No.");document.getElementById("rollNo").focus();return;}
document.getElementById("studentScreen").classList.add("hidden");
document.getElementById("questionScreen").classList.remove("hidden");
showQuestion();
}

function showQuestion(){
const question=questions[currentQuestion];
document.getElementById("questionNumber").innerHTML="Question "+(currentQuestion+1)+" / "+questions.length;
document.getElementById("questionText").innerHTML=question.q;
const box=document.getElementById("optionsContainer");box.innerHTML="";
question.options.forEach(function(option,index){
const label=document.createElement("label");label.className="option";
label.innerHTML="<input type='radio' name='answer' value='"+index+"'>"+option;
box.appendChild(label);
});
document.getElementById("nextButton").innerHTML=currentQuestion===questions.length-1?"SUBMIT TEST":"NEXT";
if(window.MathJax)MathJax.typesetPromise();
}

function nextQuestion(){
const selected=document.querySelector("input[name='answer']:checked");
if(!selected){alert("Please select an answer before continuing.");return;}
if(parseInt(selected.value)===questions[currentQuestion].answer)score++;
if(currentQuestion===questions.length-1){submitTest();return;}
currentQuestion++;showQuestion();
}

function submitTest(){
document.getElementById("questionScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");
document.getElementById("result").innerHTML="Student Name: "+studentName+"<br><br>Roll No.: "+rollNo+"<br><br>Your Score: "+score+" / "+questions.length;
document.getElementById("savingMessage").innerHTML="Saving your result...";
google.script.run
.withSuccessHandler(function(){
document.getElementById("savingMessage").innerHTML="<span class='success'>✔ Your result has been saved successfully.</span>";
})
.withFailureHandler(function(error){
document.getElementById("savingMessage").innerHTML="<span class='error'>✘ Error while saving result.</span>";
alert("Unable to save result.\n\n"+error.message);
})
.saveResult(rollNo,studentName,score,questions.length);
}
</script>
</body>
</html>
